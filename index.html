<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Classic Premium Calculator</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #1c1c1c, #2c2c2c);
}

/* Calculator Container */
.container {
  display: flex;
  gap: 20px;
}

/* Calculator */
.calculator {
  background: #111;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  width: 320px;
}

/* Display */
.display {
  background: #000;
  color: #ffd700;
  font-size: 28px;
  text-align: right;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
  min-height: 60px;
}

/* Buttons Grid */
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

/* Buttons */
button {
  height: 55px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
  transition: 0.2s;
}

/* Number Buttons */
.num {
  background: #2f2f2f;
  color: #fff;
}

.num:hover {
  background: #3c3c3c;
}

/* Operators */
.op {
  background: #b8860b;
  color: black;
  font-weight: bold;
}

/* Equal Button */
.equal {
  background: #ffd700;
  color: black;
  grid-column: span 2;
}

/* Special Buttons */
.clear {
  background: #8b0000;
  color: white;
}

.back {
  background: #555;
  color: white;
}

/* Hover effect */
button:hover {
  transform: scale(1.05);
}

/* History Panel */
.history {
  width: 200px;
  background: #181818;
  color: #ddd;
  padding: 15px;
  border-radius: 15px;
  overflow-y: auto;
  max-height: 400px;
}

.history h3 {
  margin-bottom: 10px;
  color: #ffd700;
}

.history div {
  font-size: 14px;
  margin-bottom: 5px;
  border-bottom: 1px solid #333;
  padding-bottom: 5px;
}
</style>
</head>

<body>

<div class="container">

  <!-- Calculator -->
  <div class="calculator">
    <div class="display" id="display">0</div>

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="back" onclick="backspace()">⌫</button>
      <button class="op" onclick="append('%')">%</button>
      <button class="op" onclick="append('/')">÷</button>

      <button class="num" onclick="append('7')">7</button>
      <button class="num" onclick="append('8')">8</button>
      <button class="num" oncli
      ck="append('9')">9</button>
      <button class="op" onclick="append('*')">×</button>

      <button class="num" onclick="append('4')">4</button>
      <button class="num" onclick="append('5')">5</button>
      <button class="num" onclick="append('6')">6</button>
      <button class="op" onclick="append('-')">−</button>

      <button class="num" onclick="append('1')">1</button>
      <button class="num" onclick="append('2')">2</button>
      <button class="num" onclick="append('3')">3</button>
      <button class="op" onclick="append('+')">+</button>

      <button class="num" onclick="append('0')">0</button>
      <button class="num" onclick="append('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <!-- History -->
  <div class="history" id="history">
    <h3>History</h3>
  </div>

</div>

<script>
let display = document.getElementById("display");
let history = document.getElementById("history");

function append(value) {
  if (display.innerText === "0") {
    display.innerText = value;
  } else {
    display.innerText += value;
  }
}

function clearDisplay() {
  display.innerText = "0";
}

function backspace() {
  display.innerText = display.innerText.slice(0, -1) || "0";
}

function calculate() {
  try {
    let result = eval(display.innerText);
    history.innerHTML += `<div>${display.innerText} = ${result}</div>`;
    display.innerText = result;
  } catch {
    display.innerText = "Error";
  }
}

/* Keyboard Support */
document.addEventListener("keydown", function(e) {
  if (!isNaN(e.key) || "+-*/.%".includes(e.key)) {
    append(e.key);
  } else if (e.key === "Enter") {
    calculate();
  } else if (e.key === "Backspace") {
    backspace();
  } else if (e.key === "Escape") {
    clearDisplay();
  }
});
</script>

</body>
</html>
